name: Verify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'images/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'images/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opengen-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and real Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source and unit behavior
        run: npm run check
      - name: Build local workload image
        run: npm run images:build
      - name: Verify against a real Docker daemon
        env:
          OPENGEN_DOCKER_TESTS: '1'
        run: node --test test/docker.integration.test.mjs
