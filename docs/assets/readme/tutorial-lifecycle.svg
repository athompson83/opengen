@keyframes r1_1{0%,34.80%{opacity:0}34.81%,100%{opacity:1}}.r1_1{animation:r1_1 29.77s linear infinite}
@keyframes r1_2{0%,37.48%{opacity:0}37.49%,100%{opacity:1}}.r1_2{animation:r1_2 29.77s linear infinite}
@keyframes t1_2{0%,37.48%{transform:scaleX(0)}43.36%,100%{transform:scaleX(1)}}.t1_2{transform-box:fill-box;transform-origin:left;animation:t1_2 29.77s linear infinite}
@keyframes r1_3{0%,44.54%{opacity:0}44.55%,100%{opacity:1}}.r1_3{animation:r1_3 29.77s linear infinite}
@keyframes s2{0%,51.09%{opacity:0}51.93%,78.00%{opacity:1}78.84%,100%{opacity:0}}.s2{animation:s2 29.77s linear infinite}
