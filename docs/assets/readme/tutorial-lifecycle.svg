<rect width="960" height="450" rx="14" fill="url(#bg)"/>
<text x="24" y="34" class="kicker">OPENGEN TUTORIAL 4</text><text x="24" y="62" class="title">Stop, reset and keep your files</text>
<rect class="hl hlr" x="14" y="92" width="312" height="68" rx="12"/>
<g class="l0"><circle class="d0" cx="38" cy="124" r="13"/><text x="38" y="128.5" text-anchor="middle" class="num">1</text>
<text x="62" y="117" class="cap">Save some work</text><text x="62" y="136" class="det">Write a file in a new sandbox.</text></g>
<g class="l1"><circle class="d1" cx="38" cy="198" r="13"/><text x="38" y="202.5" text-anchor="middle" class="num">2</text>
<text x="62" y="191" class="cap">Stop and start</text><text x="62" y="210" class="det">Stopping frees resources; files</text><text x="62" y="226" class="det">stay.</text></g>
<g class="l2"><circle class="d2" cx="38" cy="272" r="13"/><text x="38" y="276.5" text-anchor="middle" class="num">3</text>
<text x="62" y="265" class="cap">Reset a broken sandbox</text><text x="62" y="284" class="det">Reset rebuilds the container, not</text><text x="62" y="300" class="det">your files.</text></g>
<g class="l3"><circle class="d3" cx="38" cy="346" r="13"/><text x="38" y="350.5" text-anchor="middle" class="num">4</text>
<text x="62" y="339" class="cap">List what is running</text><text x="62" y="358" class="det">Every sandbox belongs to a project.</text></g>
<rect x="352" y="86" width="590" height="162" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="352" y="86" width="590" height="30" rx="10" fill="#161b22"/><rect x="352" y="106" width="590" height="10" fill="#161b22"/>
<circle cx="370" cy="101" r="5.5" fill="#ff5f57"/><circle cx="388" cy="101" r="5.5" fill="#febc2e"/><circle cx="406" cy="101" r="5.5" fill="#28c840"/>
<text x="647" y="105" text-anchor="middle" class="bar">recorded OpenGen session</text>
<g class="scene s0"><g class="r0_0"><clipPath id="c0_0"><rect class="t0_0" x="370" y="127" width="319.9" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c0_0)"><tspan class="ps">$</tspan> ID=$(opengen create keep | jq -r .id)</text></g>
<g class="r0_1"><clipPath id="c0_1"><rect class="t0_1" x="370" y="147" width="498.09999999999997" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c0_1)"><tspan class="ps">$</tspan> opengen exec $ID --project keep -- sh -c "echo 'draft v1' &gt;</text></g>
<g class="r0_2"><clipPath id="c0_2"><rect class="t0_2" x="370" y="167" width="271.3" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c0_2)">  draft.txt" | jq -c '{exitCode}'</text></g>
<g class="r0_3"><text x="370" y="202" class="out">{"exitCode":0}</text></g></g>
<g class="scene s1"><g class="r1_0"><clipPath id="c1_0"><rect class="t1_0" x="370" y="127" width="417.09999999999997" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c1_0)"><tspan class="ps">$</tspan> opengen stop $ID --project keep | jq -c '{state}'</text></g>
<g class="r1_1"><text x="370" y="162" class="out">{"state":"stopped"}</text></g>
<g class="r1_2"><clipPath id="c1_2"><rect class="t1_2" x="370" y="167" width="425.2" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c1_2)"><tspan class="ps">$</tspan> opengen start $ID --project keep | jq -c '{state}'</text></g>
<g class="r1_3"><text x="370" y="202" class="out">{"state":"running"}</text></g></g>
<g class="scene s2"><g class="r2_0"><clipPath id="c2_0"><rect class="t2_0" x="370" y="127" width="425.2" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c2_0)"><tspan class="ps">$</tspan> opengen reset $ID --project keep | jq -c '{state}'</text></g>
<g class="r2_1"><text x="370" y="162" class="out">{"state":"running"}</text></g>
<g class="r2_2"><clipPath id="c2_2"><rect class="t2_2" x="370" y="167" width="562.9" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c2_2)"><tspan class="ps">$</tspan> opengen read $ID draft.txt --project keep | jq -r .content | base64</text></g>
<g class="r2_3"><clipPath id="c2_3"><rect class="t2_3" x="370" y="187" width="36.4" height="20"/></clipPath><text x="370" y="202" class="cmd" clip-path="url(#c2_3)">  -d</text></g>
<g class="r2_4"><text x="370" y="222" class="out">draft v1</text></g></g>
<g class="scene s3 last"><g class="r3_0"><clipPath id="c3_0"><rect class="t3_0" x="370" y="127" width="506.2" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c3_0)"><tspan class="ps">$</tspan> opengen list --project keep | jq -c '[.[] | {state, project:</text></g>
<g class="r3_1"><clipPath id="c3_1"><rect class="t3_1" x="370" y="147" width="125.5" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c3_1)">  .projectId}]'</text></g>
<g class="r3_2"><text x="370" y="182" class="out">[{"state":"running","project":"keep"}]</text></g></g>
<rect x="24" y="428" width="912" height="5" rx="2.5" fill="#21262d"/><rect class="pg" x="24" y="428" width="912" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
