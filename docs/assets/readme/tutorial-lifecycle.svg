<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="Tutorial 4: Stop, reset and keep your files. Steps: 1. Save some work 2. Stop and start 3. Reset a broken sandbox 4. List what is running. Recorded from a real OpenGen session.">
<title>Tutorial 4: Stop, reset and keep your files</title>
