<svg xmlns="http://www.w3.org/2000/svg" width="940" height="248" viewBox="0 0 940 248" role="img" aria-label="Workspace files survive stop, start and reset: a recorded OpenGen terminal session">
<title>Workspace files survive stop, start and reset</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.cmd{fill:#e6edf3}.ps{fill:#3fb950;font-weight:700}.out{fill:#8b949e}.bar{fill:#8b949e;font-family:-apple-system,"Segoe UI",sans-serif;font-size:12.5px}
@keyframes r0{0%,3.03%{opacity:0}3.04%,100%{opacity:1}}.r0{animation:r0 19.82s linear infinite}
@keyframes t0{0%,3.03%{transform:scaleX(0)}10.29%,100%{transform:scaleX(1)}}.t0{transform-box:fill-box;transform-origin:left;animation:t0 19.82s linear infinite}
@keyframes r1{0%,16.60%{opacity:0}16.61%,100%{opacity:1}}.r1{animation:r1 19.82s linear infinite}
@keyframes t1{0%,16.60%{transform:scaleX(0)}27.70%,100%{transform:scaleX(1)}}.t1{transform-box:fill-box;transform-origin:left;animation:t1 19.82s linear infinite}
@keyframes r2{0%,29.47%{opacity:0}29.48%,100%{opacity:1}}.r2{animation:r2 19.82s linear infinite}
@keyframes r3{0%,34.01%{opacity:0}34.02%,100%{opacity:1}}.r3{animation:r3 19.82s linear infinite}
@keyframes t3{0%,34.01%{transform:scaleX(0)}43.09%,100%{transform:scaleX(1)}}.t3{transform-box:fill-box;transform-origin:left;animation:t3 19.82s linear infinite}
@keyframes r4{0%,44.85%{opacity:0}44.86%,100%{opacity:1}}.r4{animation:r4 19.82s linear infinite}
@keyframes r5{0%,49.39%{opacity:0}49.40%,100%{opacity:1}}.r5{animation:r5 19.82s linear infinite}
@keyframes t5{0%,49.39%{transform:scaleX(0)}58.63%,100%{transform:scaleX(1)}}.t5{transform-box:fill-box;transform-origin:left;animation:t5 19.82s linear infinite}
@keyframes r6{0%,60.39%{opacity:0}60.40%,100%{opacity:1}}.r6{animation:r6 19.82s linear infinite}
@keyframes r7{0%,64.93%{opacity:0}64.94%,100%{opacity:1}}.r7{animation:r7 19.82s linear infinite}
@keyframes t7{0%,64.93%{transform:scaleX(0)}76.03%,100%{transform:scaleX(1)}}.t7{transform-box:fill-box;transform-origin:left;animation:t7 19.82s linear infinite}
@keyframes r8{0%,77.80%{opacity:0}77.81%,100%{opacity:1}}.r8{animation:r8 19.82s linear infinite}
@media (prefers-reduced-motion: reduce){g,rect{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="940" height="248" rx="10" fill="#0d1117"/>
<rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="470" y="20" text-anchor="middle" class="bar">Workspace files survive stop, start and reset</text>
<g class="r0"><clipPath id="c0"><rect class="t0" x="18" y="47" width="328" height="20"/></clipPath><text x="18" y="62" class="cmd" clip-path="url(#c0)"><tspan class="ps">$</tspan> ID=$(opengen create notes | jq -r .id)</text></g>
<g class="r1"><clipPath id="c1"><rect class="t1" x="18" y="67" width="733" height="20"/></clipPath><text x="18" y="82" class="cmd" clip-path="url(#c1)"><tspan class="ps">$</tspan> opengen exec $ID --project notes -- sh -c "echo shipped &gt; todo.txt" | jq -c '{exitCode}'</text></g>
<g class="r2"><text x="18" y="102" class="out">{"exitCode":0}</text></g>
<g class="r3"><clipPath id="c3"><rect class="t3" x="18" y="107" width="425.2" height="20"/></clipPath><text x="18" y="122" class="cmd" clip-path="url(#c3)"><tspan class="ps">$</tspan> opengen stop $ID --project notes | jq -c '{state}'</text></g>
<g class="r4"><text x="18" y="142" class="out">{"state":"stopped"}</text></g>
<g class="r5"><clipPath id="c5"><rect class="t5" x="18" y="147" width="433.29999999999995" height="20"/></clipPath><text x="18" y="162" class="cmd" clip-path="url(#c5)"><tspan class="ps">$</tspan> opengen reset $ID --project notes | jq -c '{state}'</text></g>
<g class="r6"><text x="18" y="182" class="out">{"state":"running"}</text></g>
<g class="r7"><clipPath id="c7"><rect class="t7" x="18" y="187" width="587.1999999999999" height="20"/></clipPath><text x="18" y="202" class="cmd" clip-path="url(#c7)"><tspan class="ps">$</tspan> opengen read $ID todo.txt --project notes | jq -r .content | base64 -d</text></g>
<g class="r8"><text x="18" y="222" class="out">shipped</text></g>
</svg>
