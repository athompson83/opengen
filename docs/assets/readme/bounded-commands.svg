<svg xmlns="http://www.w3.org/2000/svg" width="940" height="208" viewBox="0 0 940 208" role="img" aria-label="Every command has a deadline: a recorded OpenGen terminal session">
<title>Every command has a deadline</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.cmd{fill:#e6edf3}.ps{fill:#3fb950;font-weight:700}.out{fill:#8b949e}.bar{fill:#8b949e;font-family:-apple-system,"Segoe UI",sans-serif;font-size:12.5px}
@keyframes r0{0%,3.61%{opacity:0}3.62%,100%{opacity:1}}.r0{animation:r0 16.61s linear infinite}
@keyframes t0{0%,3.61%{transform:scaleX(0)}12.64%,100%{transform:scaleX(1)}}.t0{transform-box:fill-box;transform-origin:left;animation:t0 16.61s linear infinite}
@keyframes r1{0%,20.17%{opacity:0}20.18%,100%{opacity:1}}.r1{animation:r1 16.61s linear infinite}
@keyframes t1{0%,20.17%{transform:scaleX(0)}33.41%,100%{transform:scaleX(1)}}.t1{transform-box:fill-box;transform-origin:left;animation:t1 16.61s linear infinite}
@keyframes r2{0%,35.52%{opacity:0}35.53%,100%{opacity:1}}.r2{animation:r2 16.61s linear infinite}
@keyframes r3{0%,40.94%{opacity:0}40.95%,100%{opacity:1}}.r3{animation:r3 16.61s linear infinite}
@keyframes t3{0%,40.94%{transform:scaleX(0)}52.50%,100%{transform:scaleX(1)}}.t3{transform-box:fill-box;transform-origin:left;animation:t3 16.61s linear infinite}
@keyframes r4{0%,54.61%{opacity:0}54.62%,100%{opacity:1}}.r4{animation:r4 16.61s linear infinite}
@keyframes r5{0%,60.02%{opacity:0}60.03%,100%{opacity:1}}.r5{animation:r5 16.61s linear infinite}
@keyframes t5{0%,60.02%{transform:scaleX(0)}71.40%,100%{transform:scaleX(1)}}.t5{transform-box:fill-box;transform-origin:left;animation:t5 16.61s linear infinite}
@keyframes r6{0%,73.51%{opacity:0}73.52%,100%{opacity:1}}.r6{animation:r6 16.61s linear infinite}
@media (prefers-reduced-motion: reduce){g,rect{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="940" height="208" rx="10" fill="#0d1117"/>
<rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="470" y="20" text-anchor="middle" class="bar">Every command has a deadline</text>
<g class="r0"><clipPath id="c0"><rect class="t0" x="18" y="47" width="344.2" height="20"/></clipPath><text x="18" y="62" class="cmd" clip-path="url(#c0)"><tspan class="ps">$</tspan> ID=$(opengen create runaway | jq -r .id)</text></g>
<g class="r1"><clipPath id="c1"><rect class="t1" x="18" y="67" width="870.6999999999999" height="20"/></clipPath><text x="18" y="82" class="cmd" clip-path="url(#c1)"><tspan class="ps">$</tspan> opengen exec $ID --project runaway --timeout 2000 -- sleep 600 | jq -c '{exitCode, timedOut, durationMs}'</text></g>
<g class="r2"><text x="18" y="102" class="out">{"exitCode":124,"timedOut":true,"durationMs":2234}</text></g>
<g class="r3"><clipPath id="c3"><rect class="t3" x="18" y="107" width="457.59999999999997" height="20"/></clipPath><text x="18" y="122" class="cmd" clip-path="url(#c3)"><tspan class="ps">$</tspan> opengen status $ID --project runaway | jq -c '{state}'</text></g>
<g class="r4"><text x="18" y="142" class="out">{"state":"stopped"}</text></g>
<g class="r5"><clipPath id="c5"><rect class="t5" x="18" y="147" width="449.5" height="20"/></clipPath><text x="18" y="162" class="cmd" clip-path="url(#c5)"><tspan class="ps">$</tspan> opengen start $ID --project runaway | jq -c '{state}'</text></g>
<g class="r6"><text x="18" y="182" class="out">{"state":"running"}</text></g>
</svg>
