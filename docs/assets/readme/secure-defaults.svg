<svg xmlns="http://www.w3.org/2000/svg" width="940" height="228" viewBox="0 0 940 228" role="img" aria-label="Locked down by default: a recorded OpenGen terminal session">
<title>Locked down by default</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.cmd{fill:#e6edf3}.ps{fill:#3fb950;font-weight:700}.out{fill:#8b949e}.bar{fill:#8b949e;font-family:-apple-system,"Segoe UI",sans-serif;font-size:12.5px}
@keyframes r0{0%,3.53%{opacity:0}3.54%,100%{opacity:1}}.r0{animation:r0 17.01s linear infinite}
@keyframes t0{0%,3.53%{transform:scaleX(0)}12.17%,100%{transform:scaleX(1)}}.t0{transform-box:fill-box;transform-origin:left;animation:t0 17.01s linear infinite}
@keyframes r1{0%,19.52%{opacity:0}19.53%,100%{opacity:1}}.r1{animation:r1 17.01s linear infinite}
@keyframes t1{0%,19.52%{transform:scaleX(0)}31.51%,100%{transform:scaleX(1)}}.t1{transform-box:fill-box;transform-origin:left;animation:t1 17.01s linear infinite}
@keyframes r2{0%,33.57%{opacity:0}33.58%,100%{opacity:1}}.r2{animation:r2 17.01s linear infinite}
@keyframes r3{0%,38.86%{opacity:0}38.87%,100%{opacity:1}}.r3{animation:r3 17.01s linear infinite}
@keyframes t3{0%,38.86%{transform:scaleX(0)}51.79%,100%{transform:scaleX(1)}}.t3{transform-box:fill-box;transform-origin:left;animation:t3 17.01s linear infinite}
@keyframes r4{0%,53.85%{opacity:0}53.86%,100%{opacity:1}}.r4{animation:r4 17.01s linear infinite}
@keyframes r5{0%,59.14%{opacity:0}59.15%,100%{opacity:1}}.r5{animation:r5 17.01s linear infinite}
@keyframes t5{0%,59.14%{transform:scaleX(0)}65.61%,100%{transform:scaleX(1)}}.t5{transform-box:fill-box;transform-origin:left;animation:t5 17.01s linear infinite}
@keyframes r6{0%,65.61%{opacity:0}65.62%,100%{opacity:1}}.r6{animation:r6 17.01s linear infinite}
@keyframes t6{0%,65.61%{transform:scaleX(0)}72.08%,100%{transform:scaleX(1)}}.t6{transform-box:fill-box;transform-origin:left;animation:t6 17.01s linear infinite}
@keyframes r7{0%,74.13%{opacity:0}74.14%,100%{opacity:1}}.r7{animation:r7 17.01s linear infinite}
@media (prefers-reduced-motion: reduce){g,rect{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="940" height="228" rx="10" fill="#0d1117"/>
<rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="470" y="20" text-anchor="middle" class="bar">Locked down by default</text>
<g class="r0"><clipPath id="c0"><rect class="t0" x="18" y="47" width="336.09999999999997" height="20"/></clipPath><text x="18" y="62" class="cmd" clip-path="url(#c0)"><tspan class="ps">$</tspan> ID=$(opengen create locked | jq -r .id)</text></g>
<g class="r1"><clipPath id="c1"><rect class="t1" x="18" y="67" width="490" height="20"/></clipPath><text x="18" y="82" class="cmd" clip-path="url(#c1)"><tspan class="ps">$</tspan> opengen exec $ID --project locked -- id -u | jq -r .stdout</text></g>
<g class="r2"><text x="18" y="102" class="out">1000</text></g>
<g class="r3"><clipPath id="c3"><rect class="t3" x="18" y="107" width="546.6999999999999" height="20"/></clipPath><text x="18" y="122" class="cmd" clip-path="url(#c3)"><tspan class="ps">$</tspan> opengen exec $ID --project locked -- touch /etc/x | jq -r .stderr</text></g>
<g class="r4"><text x="18" y="142" class="out">touch: cannot touch '/etc/x': Read-only file system</text></g>
<g class="r5"><clipPath id="c5"><rect class="t5" x="18" y="147" width="903.0999999999999" height="20"/></clipPath><text x="18" y="162" class="cmd" clip-path="url(#c5)"><tspan class="ps">$</tspan> opengen exec $ID --project locked -- node -e "fetch('https://example.com').catch(e =&gt; console.log('offline:',</text></g>
<g class="r6"><clipPath id="c6"><rect class="t6" x="18" y="167" width="271.3" height="20"/></clipPath><text x="18" y="182" class="cmd" clip-path="url(#c6)">  e.cause.code))" | jq -r .stdout</text></g>
<g class="r7"><text x="18" y="202" class="out">offline: EAI_AGAIN</text></g>
</svg>
