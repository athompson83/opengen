<rect width="960" height="450" rx="14" fill="url(#bg)"/>
<text x="24" y="34" class="kicker">OPENGEN TUTORIAL 2</text><text x="24" y="62" class="title">Build and preview a web app</text>
<rect class="hl hlr" x="14" y="92" width="312" height="68" rx="12"/>
<g class="l0"><circle class="d0" cx="38" cy="124" r="13"/><text x="38" y="128.5" text-anchor="middle" class="num">1</text>
<text x="62" y="117" class="cap">Create a sandbox with a port</text><text x="62" y="136" class="det">Networking is opt-in; the preview</text><text x="62" y="152" class="det">binds to 127.0.0.1.</text></g>
<g class="l1"><circle class="d1" cx="38" cy="198" r="13"/><text x="38" y="202.5" text-anchor="middle" class="num">2</text>
<text x="62" y="191" class="cap">Write the app</text><text x="62" y="210" class="det">A tiny web server, written into the</text><text x="62" y="226" class="det">workspace.</text></g>
<g class="l2"><circle class="d2" cx="38" cy="272" r="13"/><text x="38" y="276.5" text-anchor="middle" class="num">3</text>
<text x="62" y="265" class="cap">Start it</text><text x="62" y="284" class="det">Run the dev server in the</text><text x="62" y="300" class="det">background.</text></g>
<g class="l3"><circle class="d3" cx="38" cy="346" r="13"/><text x="38" y="350.5" text-anchor="middle" class="num">4</text>
<text x="62" y="339" class="cap">Open the preview</text><text x="62" y="358" class="det">Visit the loopback URL in your</text><text x="62" y="374" class="det">browser.</text></g>
<rect x="352" y="86" width="590" height="162" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="352" y="86" width="590" height="30" rx="10" fill="#161b22"/><rect x="352" y="106" width="590" height="10" fill="#161b22"/>
<circle cx="370" cy="101" r="5.5" fill="#ff5f57"/><circle cx="388" cy="101" r="5.5" fill="#febc2e"/><circle cx="406" cy="101" r="5.5" fill="#28c840"/>
<text x="647" y="105" text-anchor="middle" class="bar">recorded OpenGen session</text>
<g class="scene s0"><g class="r0_0"><clipPath id="c0_0"><rect class="t0_0" x="370" y="127" width="571" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c0_0)"><tspan class="ps">$</tspan> ID=$(opengen create webapp --network bridge --port 3000 | jq -r .id)</text></g>
<g class="r0_1"><clipPath id="c0_1"><rect class="t0_1" x="370" y="147" width="562.9" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c0_1)"><tspan class="ps">$</tspan> URL=$(opengen status $ID --project webapp | jq -r '.ports[0].url');</text></g>
<g class="r0_2"><clipPath id="c0_2"><rect class="t0_2" x="370" y="167" width="93.1" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c0_2)">  echo $URL</text></g>
<g class="r0_3"><text x="370" y="202" class="out">http://127.0.0.1:32770</text></g></g>
<g class="scene s1"><g class="r1_0"><clipPath id="c1_0"><rect class="t1_0" x="370" y="127" width="376.59999999999997" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c1_0)"><tspan class="ps">$</tspan> opengen exec $ID --project webapp -- node -e</text></g>
<g class="r1_1"><clipPath id="c1_1"><rect class="t1_1" x="370" y="147" width="352.3" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c1_1)">  "require('fs').writeFileSync('server.js',</text></g>
<g class="r1_2"><clipPath id="c1_2"><rect class="t1_2" x="370" y="167" width="514.3" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c1_2)">  \"require('http').createServer((q, s) =&gt; s.end('Hello from my</text></g>
<g class="r1_3"><clipPath id="c1_3"><rect class="t1_3" x="370" y="187" width="441.4" height="20"/></clipPath><text x="370" y="202" class="cmd" clip-path="url(#c1_3)">  sandbox app')).listen(3000)\")" | jq -c '{exitCode}'</text></g>
<g class="r1_4"><text x="370" y="222" class="out">{"exitCode":0}</text></g></g>
<g class="scene s2"><g class="r2_0"><clipPath id="c2_0"><rect class="t2_0" x="370" y="127" width="538.6" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c2_0)"><tspan class="ps">$</tspan> opengen exec $ID --project webapp -- sh -c "nohup node server.js</text></g>
<g class="r2_1"><clipPath id="c2_1"><rect class="t2_1" x="370" y="147" width="336.09999999999997" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c2_1)">  &gt;/dev/null 2&gt;&amp;1 &amp;" | jq -c '{exitCode}'</text></g>
<g class="r2_2"><text x="370" y="182" class="out">{"exitCode":0}</text></g></g>
<g class="scene s3 last"><g class="r3_0"><clipPath id="c3_0"><rect class="t3_0" x="370" y="127" width="238.89999999999998" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c3_0)"><tspan class="ps">$</tspan> sleep 1; curl -s $URL; echo</text></g>
<g class="r3_1"><text x="370" y="162" class="out">Hello from my sandbox app</text></g></g>
<rect x="24" y="428" width="912" height="5" rx="2.5" fill="#21262d"/><rect class="pg" x="24" y="428" width="912" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
