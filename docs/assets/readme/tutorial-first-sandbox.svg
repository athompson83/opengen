<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" role="img" aria-label="Tutorial 1: Your first sandbox. Steps: 1. Check that Docker is ready 2. Create a sandbox 3. Run a command inside 4. Write and read a file 5. Clean up. Recorded from a real OpenGen session.">
