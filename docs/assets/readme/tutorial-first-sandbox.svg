<rect width="960" height="524" rx="14" fill="url(#bg)"/>
<text x="24" y="34" class="kicker">OPENGEN TUTORIAL 1</text><text x="24" y="62" class="title">Your first sandbox</text>
<rect class="hl hlr" x="14" y="92" width="312" height="68" rx="12"/>
<g class="l0"><circle class="d0" cx="38" cy="124" r="13"/><text x="38" y="128.5" text-anchor="middle" class="num">1</text>
<text x="62" y="117" class="cap">Check that Docker is ready</text><text x="62" y="136" class="det">doctor confirms the engine and the</text><text x="62" y="152" class="det">built image.</text></g>
<g class="l1"><circle class="d1" cx="38" cy="198" r="13"/><text x="38" y="202.5" text-anchor="middle" class="num">2</text>
<text x="62" y="191" class="cap">Create a sandbox</text><text x="62" y="210" class="det">One command; it starts locked down</text><text x="62" y="226" class="det">and offline.</text></g>
<g class="l2"><circle class="d2" cx="38" cy="272" r="13"/><text x="38" y="276.5" text-anchor="middle" class="num">3</text>
<text x="62" y="265" class="cap">Run a command inside</text><text x="62" y="284" class="det">Programs run in the container, never</text><text x="62" y="300" class="det">on your PC.</text></g>
<g class="l3"><circle class="d3" cx="38" cy="346" r="13"/><text x="38" y="350.5" text-anchor="middle" class="num">4</text>
<text x="62" y="339" class="cap">Write and read a file</text><text x="62" y="358" class="det">Files live in the sandbox workspace.</text></g>
<g class="l4"><circle class="d4" cx="38" cy="420" r="13"/><text x="38" y="424.5" text-anchor="middle" class="num">5</text>
<text x="62" y="413" class="cap">Clean up</text><text x="62" y="432" class="det">Deleting the workspace is always</text><text x="62" y="448" class="det">explicit.</text></g>
<rect x="352" y="86" width="590" height="182" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="352" y="86" width="590" height="30" rx="10" fill="#161b22"/><rect x="352" y="106" width="590" height="10" fill="#161b22"/>
<circle cx="370" cy="101" r="5.5" fill="#ff5f57"/><circle cx="388" cy="101" r="5.5" fill="#febc2e"/><circle cx="406" cy="101" r="5.5" fill="#28c840"/>
<text x="647" y="105" text-anchor="middle" class="bar">recorded OpenGen session</text>
<g class="scene s0"><g class="r0_0"><clipPath id="c0_0"><rect class="t0_0" x="370" y="127" width="473.79999999999995" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c0_0)"><tspan class="ps">$</tspan> opengen doctor | jq -c '{ready: .runtime.ready, backend:</text></g>
<g class="r0_1"><clipPath id="c0_1"><rect class="t0_1" x="370" y="147" width="166" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c0_1)">  .runtime.backend}'</text></g>
<g class="r0_2"><text x="370" y="182" class="out">{"ready":true,"backend":"docker"}</text></g></g>
<g class="scene s1"><g class="r1_0"><clipPath id="c1_0"><rect class="t1_0" x="370" y="127" width="409" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c1_0)"><tspan class="ps">$</tspan> ID=$(opengen create hello | jq -r .id); echo $ID</text></g>
<g class="r1_1"><text x="370" y="162" class="out">3b401c2a-2b75-4a98-92dc-2003c3dea992</text></g>
<g class="r1_2"><clipPath id="c1_2"><rect class="t1_2" x="370" y="167" width="514.3" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c1_2)"><tspan class="ps">$</tspan> opengen status $ID --project hello | jq -c '{state, network}'</text></g>
<g class="r1_3"><text x="370" y="202" class="out">{"state":"running","network":"none"}</text></g></g>
<g class="scene s2"><g class="r2_0"><clipPath id="c2_0"><rect class="t2_0" x="370" y="127" width="506.2" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c2_0)"><tspan class="ps">$</tspan> opengen exec $ID --project hello -- node -p "'Hello from ' +</text></g>
<g class="r2_1"><clipPath id="c2_1"><rect class="t2_1" x="370" y="147" width="287.5" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c2_1)">  process.platform" | jq -r .stdout</text></g>
<g class="r2_2"><text x="370" y="182" class="out">Hello from linux</text></g></g>
<g class="scene s3"><g class="r3_0"><clipPath id="c3_0"><rect class="t3_0" x="370" y="127" width="554.8" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c3_0)"><tspan class="ps">$</tspan> opengen exec $ID --project hello -- sh -c "echo 'my first notes' &gt;</text></g>
<g class="r3_1"><clipPath id="c3_1"><rect class="t3_1" x="370" y="147" width="271.3" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c3_1)">  notes.txt" | jq -c '{exitCode}'</text></g>
<g class="r3_2"><text x="370" y="182" class="out">{"exitCode":0}</text></g>
<g class="r3_3"><clipPath id="c3_3"><rect class="t3_3" x="370" y="187" width="571" height="20"/></clipPath><text x="370" y="202" class="cmd" clip-path="url(#c3_3)"><tspan class="ps">$</tspan> opengen read $ID notes.txt --project hello | jq -r .content | base64</text></g>
<g class="r3_4"><clipPath id="c3_4"><rect class="t3_4" x="370" y="207" width="36.4" height="20"/></clipPath><text x="370" y="222" class="cmd" clip-path="url(#c3_4)">  -d</text></g>
<g class="r3_5"><text x="370" y="242" class="out">my first notes</text></g></g>
<g class="scene s4 last"><g class="r4_0"><clipPath id="c4_0"><rect class="t4_0" x="370" y="127" width="514.3" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c4_0)"><tspan class="ps">$</tspan> opengen delete $ID --project hello --delete-workspace | jq -c</text></g>
<g class="r4_1"><clipPath id="c4_1"><rect class="t4_1" x="370" y="147" width="109.3" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c4_1)">  '{deleted}'</text></g>
<g class="r4_2"><text x="370" y="182" class="out">{"deleted":true}</text></g></g>
<rect x="24" y="502" width="912" height="5" rx="2.5" fill="#21262d"/><rect class="pg" x="24" y="502" width="912" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
