<rect width="960" height="450" rx="14" fill="url(#bg)"/>
<text x="24" y="34" class="kicker">OPENGEN TUTORIAL 3</text><text x="24" y="62" class="title">Use OpenGen from your app</text>
<rect class="hl hlr" x="14" y="92" width="312" height="68" rx="12"/>
<g class="l0"><circle class="d0" cx="38" cy="124" r="13"/><text x="38" y="128.5" text-anchor="middle" class="num">1</text>
<text x="62" y="117" class="cap">Authenticate</text><text x="62" y="136" class="det">Every call carries the owner token</text><text x="62" y="152" class="det">from init.</text></g>
<g class="l1"><circle class="d1" cx="38" cy="198" r="13"/><text x="38" y="202.5" text-anchor="middle" class="num">2</text>
<text x="62" y="191" class="cap">Create over HTTP</text><text x="62" y="210" class="det">POST /v1/sandboxes with a project</text><text x="62" y="226" class="det">id.</text></g>
<g class="l2"><circle class="d2" cx="38" cy="272" r="13"/><text x="38" y="276.5" text-anchor="middle" class="num">3</text>
<text x="62" y="265" class="cap">Run a command over HTTP</text><text x="62" y="284" class="det">argv is an array, never a host</text><text x="62" y="300" class="det">shell.</text></g>
<g class="l3"><circle class="d3" cx="38" cy="346" r="13"/><text x="38" y="350.5" text-anchor="middle" class="num">4</text>
<text x="62" y="339" class="cap">Or use the JavaScript client</text><text x="62" y="358" class="det">Typed client for trusted backend</text><text x="62" y="374" class="det">code.</text></g>
<rect x="352" y="86" width="590" height="262" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="352" y="86" width="590" height="30" rx="10" fill="#161b22"/><rect x="352" y="106" width="590" height="10" fill="#161b22"/>
