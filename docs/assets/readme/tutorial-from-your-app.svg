<text x="647" y="105" text-anchor="middle" class="bar">recorded OpenGen session</text>
<g class="scene s0"><g class="r0_0"><clipPath id="c0_0"><rect class="t0_0" x="370" y="127" width="554.8" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c0_0)"><tspan class="ps">$</tspan> H="Authorization: Bearer $(cat $OPENGEN_STATE_DIR/token)"; curl -s</text></g>
<g class="r0_1"><clipPath id="c0_1"><rect class="t0_1" x="370" y="147" width="538.6" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c0_1)">  -H "$H" $OPENGEN_URL/v1/health | jq -c '{ready: .runtime.ready}'</text></g>
<g class="r0_2"><text x="370" y="182" class="out">{"ready":true}</text></g></g>
<g class="scene s1"><g class="r1_0"><clipPath id="c1_0"><rect class="t1_0" x="370" y="127" width="498.09999999999997" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c1_0)"><tspan class="ps">$</tspan> ID=$(curl -s -H "$H" -H "Content-Type: application/json" -d</text></g>
<g class="r1_1"><clipPath id="c1_1"><rect class="t1_1" x="370" y="147" width="554.8" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c1_1)">  '{"projectId":"api-demo"}' $OPENGEN_URL/v1/sandboxes | jq -r .id);</text></g>
<g class="r1_2"><clipPath id="c1_2"><rect class="t1_2" x="370" y="167" width="85" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c1_2)">  echo $ID</text></g>
<g class="r1_3"><text x="370" y="202" class="out">d63eb459-12ca-45f9-ad64-d5b7ca67aa3b</text></g></g>
<g class="scene s2"><g class="r2_0"><clipPath id="c2_0"><rect class="t2_0" x="370" y="127" width="457.59999999999997" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c2_0)"><tspan class="ps">$</tspan> curl -s -H "$H" -H "Content-Type: application/json" -d</text></g>
<g class="r2_1"><clipPath id="c2_1"><rect class="t2_1" x="370" y="147" width="449.5" height="20"/></clipPath><text x="370" y="162" class="cmd" clip-path="url(#c2_1)">  '{"projectId":"api-demo","argv":["node","-p","6*7"]}'</text></g>
<g class="r2_2"><clipPath id="c2_2"><rect class="t2_2" x="370" y="167" width="530.5" height="20"/></clipPath><text x="370" y="182" class="cmd" clip-path="url(#c2_2)">  $OPENGEN_URL/v1/sandboxes/$ID/exec | jq -c '{exitCode, stdout}'</text></g>
<g class="r2_3"><text x="370" y="202" class="out">{"exitCode":0,"stdout":"42\n"}</text></g></g>
<g class="scene s3 last"><g class="r3_0"><clipPath id="c3_0"><rect class="t3_0" x="370" y="127" width="328" height="20"/></clipPath><text x="370" y="142" class="cmd" clip-path="url(#c3_0)"><tspan class="ps">$</tspan> sed -n 9,12p examples/local-client.mjs</text></g>
<g class="r3_1"><text x="370" y="162" class="out">const sandbox = await client.create({ projectId });</text></g>
<g class="r3_2"><text x="370" y="182" class="out">try {</text></g>
<g class="r3_3"><text x="370" y="202" class="out">  await client.writeFile(sandbox.id, { projectId, path: 'hello.mjs',</text></g>
<g class="r3_4"><text x="370" y="222" class="out">  content: 'console.log("Hello from OpenGen");\n' });</text></g>
<g class="r3_5"><text x="370" y="242" class="out">  const result = await client.exec(sandbox.id, { projectId, argv:</text></g>
<g class="r3_6"><text x="370" y="262" class="out">  ['node', 'hello.mjs'] });</text></g>
<g class="r3_7"><clipPath id="c3_7"><rect class="t3_7" x="370" y="267" width="506.2" height="20"/></clipPath><text x="370" y="282" class="cmd" clip-path="url(#c3_7)"><tspan class="ps">$</tspan> node examples/local-client.mjs | jq -c '.result | {exitCode,</text></g>
<g class="r3_8"><clipPath id="c3_8"><rect class="t3_8" x="370" y="287" width="85" height="20"/></clipPath><text x="370" y="302" class="cmd" clip-path="url(#c3_8)">  stdout}'</text></g>
<g class="r3_9"><text x="370" y="322" class="out">{"exitCode":0,"stdout":"Hello from OpenGen\n"}</text></g></g>
