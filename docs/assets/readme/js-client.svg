<svg xmlns="http://www.w3.org/2000/svg" width="940" height="228" viewBox="0 0 940 228" role="img" aria-label="Drive it from your own app: a recorded OpenGen terminal session">
<title>Drive it from your own app</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.cmd{fill:#e6edf3}.ps{fill:#3fb950;font-weight:700}.out{fill:#8b949e}.bar{fill:#8b949e;font-family:-apple-system,"Segoe UI",sans-serif;font-size:12.5px}
@keyframes r0{0%,5.86%{opacity:0}5.87%,100%{opacity:1}}.r0{animation:r0 10.24s linear infinite}
@keyframes t0{0%,5.86%{transform:scaleX(0)}19.92%,100%{transform:scaleX(1)}}.t0{transform-box:fill-box;transform-origin:left;animation:t0 10.24s linear infinite}
@keyframes r1{0%,23.34%{opacity:0}23.35%,100%{opacity:1}}.r1{animation:r1 10.24s linear infinite}
@keyframes r2{0%,23.34%{opacity:0}23.35%,100%{opacity:1}}.r2{animation:r2 10.24s linear infinite}
@keyframes r3{0%,23.34%{opacity:0}23.35%,100%{opacity:1}}.r3{animation:r3 10.24s linear infinite}
@keyframes r4{0%,23.34%{opacity:0}23.35%,100%{opacity:1}}.r4{animation:r4 10.24s linear infinite}
@keyframes r5{0%,23.34%{opacity:0}23.35%,100%{opacity:1}}.r5{animation:r5 10.24s linear infinite}
@keyframes r6{0%,32.13%{opacity:0}32.14%,100%{opacity:1}}.r6{animation:r6 10.24s linear infinite}
@keyframes t6{0%,32.13%{transform:scaleX(0)}53.61%,100%{transform:scaleX(1)}}.t6{transform-box:fill-box;transform-origin:left;animation:t6 10.24s linear infinite}
@keyframes r7{0%,57.03%{opacity:0}57.04%,100%{opacity:1}}.r7{animation:r7 10.24s linear infinite}
@media (prefers-reduced-motion: reduce){g,rect{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="940" height="228" rx="10" fill="#0d1117"/>
<rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="470" y="20" text-anchor="middle" class="bar">Drive it from your own app</text>
<g class="r0"><clipPath id="c0"><rect class="t0" x="18" y="47" width="328" height="20"/></clipPath><text x="18" y="62" class="cmd" clip-path="url(#c0)"><tspan class="ps">$</tspan> sed -n 9,12p examples/local-client.mjs</text></g>
<g class="r1"><text x="18" y="82" class="out">const sandbox = await client.create({ projectId });</text></g>
<g class="r2"><text x="18" y="102" class="out">try {</text></g>
<g class="r3"><text x="18" y="122" class="out">  await client.writeFile(sandbox.id, { projectId, path: 'hello.mjs', content: 'console.log("Hello from</text></g>
<g class="r4"><text x="18" y="142" class="out">  OpenGen");\n' });</text></g>
<g class="r5"><text x="18" y="162" class="out">  const result = await client.exec(sandbox.id, { projectId, argv: ['node', 'hello.mjs'] });</text></g>
<g class="r6"><clipPath id="c6"><rect class="t6" x="18" y="167" width="579.1" height="20"/></clipPath><text x="18" y="182" class="cmd" clip-path="url(#c6)"><tspan class="ps">$</tspan> node examples/local-client.mjs | jq -c '.result | {exitCode, stdout}'</text></g>
<g class="r7"><text x="18" y="202" class="out">{"exitCode":0,"stdout":"Hello from OpenGen\n"}</text></g>
</svg>
