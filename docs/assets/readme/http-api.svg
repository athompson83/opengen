<svg xmlns="http://www.w3.org/2000/svg" width="940" height="228" viewBox="0 0 940 228" role="img" aria-label="An authenticated loopback HTTP API: a recorded OpenGen terminal session">
<title>An authenticated loopback HTTP API</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
.cmd{fill:#e6edf3}.ps{fill:#3fb950;font-weight:700}.out{fill:#8b949e}.bar{fill:#8b949e;font-family:-apple-system,"Segoe UI",sans-serif;font-size:12.5px}
@keyframes r0{0%,4.27%{opacity:0}4.28%,100%{opacity:1}}.r0{animation:r0 14.05s linear infinite}
@keyframes t0{0%,4.27%{transform:scaleX(0)}12.10%,100%{transform:scaleX(1)}}.t0{transform-box:fill-box;transform-origin:left;animation:t0 14.05s linear infinite}
@keyframes r1{0%,12.10%{opacity:0}12.11%,100%{opacity:1}}.r1{animation:r1 14.05s linear infinite}
@keyframes t1{0%,12.10%{transform:scaleX(0)}19.93%,100%{transform:scaleX(1)}}.t1{transform-box:fill-box;transform-origin:left;animation:t1 14.05s linear infinite}
@keyframes r2{0%,22.42%{opacity:0}22.43%,100%{opacity:1}}.r2{animation:r2 14.05s linear infinite}
@keyframes r3{0%,28.83%{opacity:0}28.84%,100%{opacity:1}}.r3{animation:r3 14.05s linear infinite}
@keyframes t3{0%,28.83%{transform:scaleX(0)}41.64%,100%{transform:scaleX(1)}}.t3{transform-box:fill-box;transform-origin:left;animation:t3 14.05s linear infinite}
@keyframes r4{0%,44.13%{opacity:0}44.14%,100%{opacity:1}}.r4{animation:r4 14.05s linear infinite}
@keyframes r5{0%,50.53%{opacity:0}50.54%,100%{opacity:1}}.r5{animation:r5 14.05s linear infinite}
@keyframes t5{0%,50.53%{transform:scaleX(0)}58.36%,100%{transform:scaleX(1)}}.t5{transform-box:fill-box;transform-origin:left;animation:t5 14.05s linear infinite}
@keyframes r6{0%,58.36%{opacity:0}58.37%,100%{opacity:1}}.r6{animation:r6 14.05s linear infinite}
@keyframes t6{0%,58.36%{transform:scaleX(0)}66.19%,100%{transform:scaleX(1)}}.t6{transform-box:fill-box;transform-origin:left;animation:t6 14.05s linear infinite}
@keyframes r7{0%,68.68%{opacity:0}68.69%,100%{opacity:1}}.r7{animation:r7 14.05s linear infinite}
@media (prefers-reduced-motion: reduce){g,rect{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="940" height="228" rx="10" fill="#0d1117"/>
<rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="470" y="20" text-anchor="middle" class="bar">An authenticated loopback HTTP API</text>
<g class="r0"><clipPath id="c0"><rect class="t0" x="18" y="47" width="878.8" height="20"/></clipPath><text x="18" y="62" class="cmd" clip-path="url(#c0)"><tspan class="ps">$</tspan> curl -s -H "Authorization: Bearer $(cat $OPENGEN_STATE_DIR/token)" $OPENGEN_URL/v1/health | jq -c '{ready:</text></g>
<g class="r1"><clipPath id="c1"><rect class="t1" x="18" y="67" width="149.79999999999998" height="20"/></clipPath><text x="18" y="82" class="cmd" clip-path="url(#c1)">  .runtime.ready}'</text></g>
<g class="r2"><text x="18" y="102" class="out">{"ready":true}</text></g>
<g class="r3"><clipPath id="c3"><rect class="t3" x="18" y="107" width="425.2" height="20"/></clipPath><text x="18" y="122" class="cmd" clip-path="url(#c3)"><tspan class="ps">$</tspan> curl -s $OPENGEN_URL/v1/health | jq -c .error.code</text></g>
<g class="r4"><text x="18" y="142" class="out">"UNAUTHORIZED"</text></g>
<g class="r5"><clipPath id="c5"><rect class="t5" x="18" y="147" width="822.0999999999999" height="20"/></clipPath><text x="18" y="162" class="cmd" clip-path="url(#c5)"><tspan class="ps">$</tspan> curl -s -H "Origin: https://example.com" -H "Authorization: Bearer $(cat $OPENGEN_STATE_DIR/token)"</text></g>
<g class="r6"><clipPath id="c6"><rect class="t6" x="18" y="167" width="360.4" height="20"/></clipPath><text x="18" y="182" class="cmd" clip-path="url(#c6)">  $OPENGEN_URL/v1/health | jq -c .error.code</text></g>
<g class="r7"><text x="18" y="202" class="out">"ORIGIN_REJECTED"</text></g>
</svg>
